name: Daily install

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
      - name: Run install loop from run.sh
        shell: bash
        run: |
          set -e

          npm install -g pnpm
          
          # 判断今天是否为周一（date +%u：1=周一）
          is_monday=0
          if [ "$(date +%u)" = "1" ]; then
            is_monday=1
          fi
          
          for i in $(seq 1 1300); do
            echo "========== Iteration ${i} =========="
          
            # 1. 删除 node_modules 目录
            rm -rf node_modules > /dev/null 2>&1
          
            # 2. 清理 pnpm 缓存
            pnpm cache delete > /dev/null 2>&1
            pnpm store prune > /dev/null 2>&1
          
            # 3. 安装依赖：周一安装 enum-plus@latest，其它日期执行无参 pnpm install
            if [ ${is_monday} -eq 1 ]; then
              pnpm install enum-plus@latest --registry https://registry.npmjs.org/ --no-lockfile | grep 'done' || echo error
            else
              pnpm install --registry https://registry.npmjs.org/ --no-lockfile | grep 'done' || echo error
            fi
          
            # 4. 生成1~2秒范围内的随机延时
            delay=$(( RANDOM % 2 + 1 ))
            echo "Waiting for ${delay} seconds..."
            sleep ${delay}
          done
          
          echo "All iterations completed."
