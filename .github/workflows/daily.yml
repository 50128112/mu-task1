name: Daily install

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run install loop from run.sh
        shell: bash
        run: |
          set -e

          for i in $(seq 1 800); do
            echo "========== Iteration ${i} =========="

            # 1. Delete node_modules directory
            rm -rf node_modules > /dev/null 2>&1

            # 2. Clear npm cache
            npm cache clean --force

            # 3. Install dependencies
            npm install --registry https://registry.npmjs.org/ --no-package-lock || echo failed

            # 4. Generate a random delay between 5 and 25 seconds
            delay=1
            echo "Waiting for ${delay} seconds..."
            sleep ${delay}
          done

          echo "All iterations completed."
