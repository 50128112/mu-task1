name: Daily install

on:
  schedule:
    # UTC time
    - cron: "0 0 * * *"
    - cron: "5 2 * * *"
    - cron: "10 4 * * *"
    - cron: "15 6 * * *"
    - cron: "20 8 * * *"
    - cron: "25 10 * * *"
    - cron: "30 12 * * *"
    - cron: "35 14 * * *"
    - cron: "40 16 * * *"
    - cron: "45 18 * * *"
    - cron: "50 20 * * *"
    - cron: "55 22 * * *"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install sing-box
        uses: ./.github/actions/install-sing-box
        with:
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Run install loop from run.sh
        shell: bash
        env:
          HTTP_PROXY: http://127.0.0.1:10808
          HTTPS_PROXY: http://127.0.0.1:10808
          ALL_PROXY: http://127.0.0.1:10808
        run: |
          set -e

          env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY npm install -g pnpm@11.25.0

          pnpm config set proxy http://127.0.0.1:10808
          pnpm config set https-proxy http://127.0.0.1:10808

          pnpm config list | grep -i proxy

          # 判断今天是否为周一（date +%u：1=周一）
          is_monday=0
          if [ "$(date +%u)" = "1" ]; then
            is_monday=1
          fi

          for i in $(seq 1 100); do
            echo
            echo "========== Iteration ${i} =========="

            # 1. 删除 node_modules 目录
            rm -rf node_modules > /dev/null 2>&1

            # 2. 清理 pnpm 缓存
            pnpm cache delete > /dev/null 2>&1
            pnpm store prune > /dev/null 2>&1

            date "+%Y-%m-%d %H:%M:%S"

            # 3. 安装依赖：周一安装 enum-plus@latest，其它日期执行无参 pnpm install
            if [ ${is_monday} -eq 1 ]; then
              pnpm install enum-plus@latest --registry https://registry.npmjs.org/ --no-lockfile | grep 'downloaded 1'
            else
              pnpm install --registry https://registry.npmjs.org/ --no-lockfile | grep 'downloaded 1'
            fi

            # 4. 生成1~2秒范围内的随机延时
            delay=$(( RANDOM % 2 + 3 ))
            echo "Waiting for ${delay} seconds..."
            sleep ${delay}
          done

          echo "All iterations completed."

      - name: Print sing-box log
        run: |
          echo "=== sing-box log ==="
          tail -n 200 /tmp/sing-box.log || true
