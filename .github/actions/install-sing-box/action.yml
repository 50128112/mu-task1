name: Install sing-box
description: Install sing-box (SagerNet) and start it with a bundled config

inputs:
  username:
    required: true
  password:
    required: true

  version:
    description: >
      sing-box version to install (e.g. "1.12.0"). Leave empty to install
      the latest stable release.
    required: false
    default: ''

  script-url:
    description: URL of the sing-box install script.
    required: false
    default: 'https://sing-box.app/deb-install.sh'

  config-path:
    description: Destination path for the sing-box config file.
    required: false
    default: '/tmp/sing-box/config.json'

  log-path:
    description: Log file path for the background sing-box process.
    required: false
    default: '/tmp/sing-box.log'

runs:
  using: composite
  steps:
    - name: Install sing-box
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        INSTALL_URL: ${{ inputs.script-url }}
      run: |
        set -euo pipefail

        curl -fsSL "${INSTALL_URL}" | bash -s -- ${VERSION}

        sing-box version

    - name: Write config & start sing-box
      shell: bash
      env:
        USERNAME: ${{ inputs.username }}
        PASSWORD: ${{ inputs.password }}
        CONFIG_PATH: ${{ inputs.config-path }}
        LOG_PATH: ${{ inputs.log-path }}
      run: |
        set -euo pipefail

        CONFIG_DIR="$(dirname "${CONFIG_PATH}")"
        mkdir -p "${CONFIG_DIR}"
        nodes=( "wtw1" "wtw2" "wtw3" "wtw4" "wtw5" "wtw6" "whk1" "whk2" "whk3" "whk4" "whk5" "whk6" "whk7" "whk8" "whk9" "whk10" "wjp1" "wjp2" "wjp3" "wjp4" "wjp5" "wjp6" "wjp7" "wsg1" "wsg2" "wsg3" "wsg4" "wsg5" "wsg6" "wsg7" "wsg8" "wkr1" "wkr2" "wmy1" "wvn1" "win1" "wid1" "wth1" "wca1" "wus2" "wus3" "wus4" "wus5" "wus6" "wus7" "wus8" "wus9" "wus10" "wat1" )
